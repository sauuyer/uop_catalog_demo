<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UOP Data Catalog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <!-- ===== UOP catalog: the <style>, the #uop-catalog div and the last <script> are self-contained ===== -->
  <style>
    /* standalone preview only; the real page supplies its own fonts */
    body { margin: 16px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    #uop-catalog { --ink: #1b2a36; --muted: #5d6c79; --line: #d9e0e6; --card: #fff; --faint: #f3f6f8;
      --accent: #0b6e8f; --accent-soft: #e3f1f6; --chip: #edf1f4; font: inherit; color: var(--ink); line-height: 1.45; }
    #uop-catalog *, #uop-catalog *::before, #uop-catalog *::after { box-sizing: border-box; }
    #uop-catalog button, #uop-catalog select, #uop-catalog input { font: inherit; color: inherit; }
    #uop-catalog :focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    #uop-catalog .uc-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #uop-catalog [hidden] { display: none !important; }

    #uop-catalog .uc-search input { width: 100%; padding: 11px 14px; font-size: 17px; border: 2px solid var(--line); border-radius: 2px; background: #fff; }
    #uop-catalog .uc-search input:focus { border-color: var(--accent); outline: none; }
    #uop-catalog .uc-hint { margin: 6px 2px 0; font-size: 13px; color: var(--muted); }

    #uop-catalog .uc-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; margin-top: 16px; align-items: start; }
    @media (max-width: 900px) { #uop-catalog .uc-layout { grid-template-columns: 1fr; } }

    /* ---- filters ---- */
    #uop-catalog .uc-filters { background: var(--card); border: 1px solid var(--line); border-radius: 2px; }
    #uop-catalog .uc-filters > summary { cursor: pointer; padding: 11px 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; list-style: none; }
    #uop-catalog .uc-filters > summary::-webkit-details-marker { display: none; }
    #uop-catalog .uc-body { padding: 0 14px 12px; }
    #uop-catalog fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
    #uop-catalog legend { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 0; margin-bottom: 5px; }
    #uop-catalog .uc-opt { display: flex; align-items: flex-start; gap: 7px; padding: 3px 0; cursor: pointer; font-size: 14.5px; }
    #uop-catalog .uc-opt input { margin: 3px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
    #uop-catalog .uc-opt .uc-lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #uop-catalog .uc-opt .uc-n { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
    #uop-catalog .uc-opt.uc-zero:not(.uc-on) { opacity: .45; }
    #uop-catalog #uc-f-project .uc-list { max-height: 210px; overflow-y: auto; padding-right: 4px; scrollbar-gutter: stable; }
    #uop-catalog .uc-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; margin-top: 6px; }
    #uop-catalog .uc-grp { border-top: 1px solid var(--line); }
    #uop-catalog .uc-grp > summary { cursor: pointer; padding: 5px 0; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; }
    #uop-catalog .uc-grp > summary .uc-n { font-weight: 400; color: var(--muted); font-size: 12.5px; }
    #uop-catalog .uc-small { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; background: #fff; font-size: 14px; }
    #uop-catalog .uc-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
    #uop-catalog .uc-row label { font-size: 13px; color: var(--muted); width: 48px; flex: none; }
    #uop-catalog .uc-row > span { font-size: 13px; color: var(--muted); }
    #uop-catalog .uc-sec { border-top: 1px solid var(--line); padding: 7px 0; margin-bottom: 8px; }
    #uop-catalog .uc-sec > summary { cursor: pointer; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    #uop-catalog .uc-help { font-size: 12.5px; color: var(--muted); margin: 3px 0 6px; }
    #uop-catalog .uc-link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: inherit; }
    #uop-catalog .uc-btn-sm { padding: 5px 10px; border: 1px solid var(--line); background: #fff; border-radius: 2px; cursor: pointer; font-size: 13.5px; }
    #uop-catalog .uc-btn-sm:hover:not(:disabled), #uop-catalog .uc-btn-sm.uc-on { border-color: var(--accent); }
    #uop-catalog .uc-btn-sm.uc-on { background: var(--accent-soft); }

    /* ---- range sliders (time: horizontal, depth: vertical) ---- */
    #uop-catalog .uc-sl { position: relative; user-select: none; touch-action: none; }
    #uop-catalog .uc-sl-track { position: absolute; background: var(--line); border-radius: 2px; }
    #uop-catalog .uc-sl-band { position: absolute; background: var(--accent); border-radius: 2px; opacity: .85; }
    #uop-catalog .uc-sl.uc-sl-off .uc-sl-band { background: #9fb7c3; opacity: .6; }
    #uop-catalog .uc-sl-handle { position: absolute; width: 20px; height: 20px; margin: -7px 0 0 -7px; border-radius: 50%; border: 3px solid #fff; background: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.4); cursor: grab; padding: 0; touch-action: none; }
    #uop-catalog .uc-sl-handle:active { cursor: grabbing; }
    #uop-catalog .uc-sl-hist { position: absolute; display: flex; }
    #uop-catalog .uc-sl-hist i { display: block; background: #c9dde6; }
    #uop-catalog .uc-sl-ticks { position: absolute; }
    #uop-catalog .uc-sl-ticks span { position: absolute; font-size: 11px; color: var(--muted); white-space: nowrap; }
    #uop-catalog .uc-sl-h { height: 78px; margin: 4px 10px 6px; }
    #uop-catalog .uc-sl-h .uc-sl-hist { left: 0; right: 0; top: 0; height: 34px; align-items: flex-end; gap: 0; }
    #uop-catalog .uc-sl-h .uc-sl-hist i { flex: 1 1 0; min-width: 0; }
    #uop-catalog .uc-sl-h .uc-sl-track { left: 0; right: 0; top: 42px; height: 6px; }
    #uop-catalog .uc-sl-h .uc-sl-band { top: 0; bottom: 0; }
    #uop-catalog .uc-sl-h .uc-sl-handle { top: 3px; }
    #uop-catalog .uc-sl-h .uc-sl-ticks { left: 0; right: 0; top: 56px; height: 16px; }
    #uop-catalog .uc-sl-h .uc-sl-ticks span { transform: translateX(-50%); }
    #uop-catalog .uc-sl-v { height: 270px; margin: 6px 0 8px; }
    #uop-catalog .uc-sl-v .uc-sl-hist { left: 78px; right: 0; top: 0; bottom: 0; flex-direction: column; gap: 0; }
    #uop-catalog .uc-sl-v .uc-sl-hist i { flex: 1; min-height: 1px; border-radius: 0 2px 2px 0; }
    #uop-catalog .uc-sl-v .uc-sl-track { left: 60px; top: 0; bottom: 0; width: 6px; }
    #uop-catalog .uc-sl-v .uc-sl-band { left: 0; right: 0; }
    #uop-catalog .uc-sl-v .uc-sl-handle { left: 3px; }
    #uop-catalog .uc-sl-v .uc-sl-ticks { left: 0; top: 0; bottom: 0; width: 50px; }
    #uop-catalog .uc-sl-v .uc-sl-ticks span { right: 0; transform: translateY(-50%); }

    /* ---- visualisation panel ---- */
    #uop-catalog .uc-viz { border: 1px solid var(--line); border-radius: 2px; background: #fff; margin-bottom: 12px; overflow: hidden; }
    #uop-catalog .uc-vizbar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; flex-wrap: wrap; }
    #uop-catalog .uc-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
    #uop-catalog .uc-seg button { border: 0; background: #fff; padding: 6px 14px; cursor: pointer; }
    #uop-catalog .uc-seg button + button { border-left: 1px solid var(--line); }
    #uop-catalog .uc-seg button[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
    #uop-catalog .uc-spacer { flex: 1; }
    #uop-catalog .uc-clearbtn { border: 1.5px solid #b4235a; background: #fff; color: #b4235a; border-radius: 2px; padding: 4px 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    #uop-catalog .uc-clearbtn:hover:not([aria-disabled="true"]) { background: #b4235a; color: #fff; }
    #uop-catalog .uc-clearbtn[aria-disabled="true"] { opacity: .4; cursor: default; }
    #uop-catalog .uc-filters > summary .uc-clearbtn { padding: 2px 8px; font-size: 12.5px; }
    #uop-catalog #uc-map { height: 310px; border-top: 1px solid var(--line); }
    #uop-catalog #uc-chart { border-top: 1px solid var(--line); overflow-x: auto; overflow-y: auto; max-height: 460px; }
    #uop-catalog #uc-chart svg { display: block; max-width: none; }
    #uop-catalog #uc-chart text { font: 11px system-ui, sans-serif; fill: #5d6c79; }
    #uop-catalog #uc-chart text.uc-ch-h { font-weight: 700; font-size: 12px; fill: #1b2a36; }
    #uop-catalog .uc-hover { margin: 0; padding: 7px 12px; font-size: 13.5px; line-height: 20px; border-top: 1px solid var(--line); background: var(--faint); height: 56px; overflow: hidden; }
    #uop-catalog .uc-mapnote { padding: 20px; color: var(--muted); text-align: center; }
    #uop-catalog .leaflet-popup-content button { margin-top: 6px; background: #0b6e8f; color: #fff; border: 0; border-radius: 2px; padding: 4px 9px; cursor: pointer; }

    /* ---- results ---- */
    #uop-catalog .uc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
    #uop-catalog .uc-fchip { background: var(--accent-soft); border: 1px solid transparent; border-radius: 2px; padding: 2px 6px 2px 11px; font-size: 13.5px; cursor: pointer; }
    #uop-catalog .uc-fchip:hover { border-color: var(--accent); }
    #uop-catalog .uc-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    #uop-catalog .uc-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
    #uop-catalog .uc-tabs button { border: 0; background: #fff; padding: 6px 14px; cursor: pointer; }
    #uop-catalog .uc-tabs button[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
    #uop-catalog .uc-toolbar select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 2px; background: #fff; }
    #uop-catalog .uc-count { color: var(--muted); font-size: 14px; margin: 0; }
    #uop-catalog .uc-card { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--pc, var(--accent)); border-radius: 2px; padding: 12px 15px; margin-bottom: 10px; }
    #uop-catalog .uc-card h3 { margin: 3px 0 8px; font-size: 17px; line-height: 1.3; }
    #uop-catalog .uc-ptag { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; }
    #uop-catalog button.uc-ptag:hover { text-decoration: underline; }
    #uop-catalog .uc-badge { font-size: 12px; background: var(--chip); color: var(--muted); border-radius: 2px; padding: 0 8px; margin-left: 6px; }
    #uop-catalog .uc-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; margin: 6px 0 8px; }
    #uop-catalog .uc-meta dt { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
    #uop-catalog .uc-meta dd { margin: 0; font-size: 14.5px; }
    #uop-catalog .uc-sub { color: var(--muted); font-size: 12.5px; }
    #uop-catalog .uc-strip { position: relative; height: 26px; margin: 2px 0 8px; }
    #uop-catalog .uc-strip .uc-strip-rail { position: absolute; left: 0; right: 0; top: 3px; height: 8px; background: var(--faint); border-radius: 2px; }
    #uop-catalog .uc-strip .uc-strip-bar { position: absolute; top: 3px; height: 8px; background: var(--pc, var(--accent)); border-radius: 2px; min-width: 3px; }
    #uop-catalog .uc-strip .uc-strip-tick { position: absolute; top: 0; height: 14px; width: 1px; background: #cdd7de; }
    #uop-catalog .uc-strip .uc-strip-lab { position: absolute; top: 14px; font-size: 10.5px; color: var(--muted); transform: translateX(-50%); }
    #uop-catalog .uc-vchips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; align-items: center; }
    #uop-catalog .uc-vchip { border: 1px solid var(--line); background: var(--chip); border-radius: 2px; padding: 1px 9px; font-size: 13px; cursor: pointer; }
    #uop-catalog .uc-vchip:hover { border-color: var(--accent); }
    #uop-catalog .uc-vchip.uc-on { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
    #uop-catalog details.uc-more > summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 600; padding: 3px 0; }
    #uop-catalog .uc-text { margin: 6px 0; font-size: 14.5px; }
    #uop-catalog table.uc-vars { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0; }
    #uop-catalog .uc-vars th, #uop-catalog .uc-vars td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    #uop-catalog .uc-vars th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    #uop-catalog .uc-scroll { overflow-x: auto; }
    #uop-catalog .uc-kw { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
    #uop-catalog .uc-kw span { font-size: 12.5px; background: var(--chip); border-radius: 2px; padding: 1px 7px; color: var(--muted); }
    #uop-catalog .uc-fileline { font-size: 13.5px; color: var(--muted); margin: 4px 0; }
    #uop-catalog .uc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    #uop-catalog .uc-btn { display: inline-block; text-decoration: none; background: var(--accent); color: #fff; padding: 5px 12px; border-radius: 2px; font-size: 14px; font-weight: 600; border: 0; cursor: pointer; }
    #uop-catalog .uc-btn.uc-ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    #uop-catalog .uc-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 4px 0; }
    #uop-catalog .uc-clamp.uc-open { display: block; }
    #uop-catalog .uc-empty { background: var(--card); border: 1px dashed var(--line); border-radius: 2px; padding: 22px; color: var(--muted); }
    #uop-catalog .uc-empty ul { margin: 8px 0 0; padding-left: 18px; }
    #uop-catalog .uc-err { background: #fff4d6; color: #7a5200; padding: 14px; border-radius: 2px; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="uop-catalog" data-catalog-url="./catalog.json">
    <form class="uc-search" role="search" onsubmit="return false">
      <label class="uc-sr" for="uc-q">Search datasets</label>
      <input id="uc-q" type="search" autocomplete="off" placeholder="Search across UOP projects and datasets" />
    </form>

    <div class="uc-layout" id="uc-app" hidden>
      <details class="uc-filters" id="uc-filters" open>
        <summary><span>Filters</span> <button type="button" class="uc-clearbtn" id="uc-reset-top" aria-disabled="true">✕ Clear filters</button></summary>
        <div class="uc-body">
          <fieldset id="uc-f-project"><legend>Project</legend><div class="uc-list"></div></fieldset>

          <fieldset id="uc-f-var">
            <legend>Variables measured</legend>
            <div class="uc-row" id="uc-varmode" hidden><span>Datasets with</span>
              <select id="uc-mode" class="uc-small" style="width:auto" aria-label="Match mode"><option value="all">all selected</option><option value="any">any selected</option></select></div>
            <label class="uc-sr" for="uc-vfilter">Filter the variable list</label>
            <input class="uc-small" id="uc-vfilter" type="search" placeholder="Find a variable…" />
            <div id="uc-vlist" style="margin-top:6px"></div>
          </fieldset>

          <fieldset id="uc-f-time">
            <legend>Time period</legend>
            <div id="uc-tslider"></div>
            <div class="uc-row"><label for="uc-from">From</label><input class="uc-small" type="month" id="uc-from" placeholder="YYYY-MM"></div>
            <div class="uc-row"><label for="uc-to">To</label><input class="uc-small" type="month" id="uc-to" placeholder="YYYY-MM"></div>
          </fieldset>

          <fieldset id="uc-f-depth">
            <legend>Measurement depth</legend>
            <div id="uc-dslider"></div>
            <div class="uc-row"><label for="uc-dmin">From</label><input class="uc-small" id="uc-dmin" type="number" step="any" min="0"><span>m</span></div>
            <div class="uc-row"><label for="uc-dmax">To</label><input class="uc-small" id="uc-dmax" type="number" step="any" min="0"><span>m</span></div>
          </fieldset>

        </div>
      </details>

      <main>
        <div class="uc-viz">
          <div class="uc-vizbar">
            <div class="uc-seg" role="tablist" aria-label="How to view the datasets">
              <button role="tab" data-view="map" aria-selected="true">Map</button>
              <button role="tab" data-view="time" aria-selected="false">Project timeline</button>
              <button role="tab" data-view="vardepth" aria-selected="false">Water column variables by depth</button>
              <button role="tab" data-view="none" aria-selected="false">Hide</button>
            </div>
            <span class="uc-spacer"></span>
            <span class="uc-sub" id="uc-vizhelp"></span>
            <span class="uc-sub" id="uc-bylabel" hidden>Split by</span><div class="uc-seg" id="uc-by" role="group" aria-label="Split the chart by" hidden><button data-by="project" aria-pressed="true">Project</button><button data-by="basin" aria-pressed="false">Ocean basin</button></div>
            <button class="uc-btn-sm" id="uc-draw" type="button">▭ Draw filter box</button><button class="uc-clearbtn" id="uc-clearbox" type="button" hidden>✕ Clear map box</button><button class="uc-clearbtn" id="uc-cleartime" type="button" hidden>✕ Clear period</button><button class="uc-clearbtn" id="uc-cleardepth" type="button" hidden>✕ Clear depth range</button>
          </div>
          <div id="uc-map" role="img" aria-label="Map of measurement locations"></div>
          <div id="uc-chart"></div>
          <p class="uc-hover" id="uc-hover" hidden></p>
        </div>

        <div class="uc-chips" id="uc-active"></div>
        <div class="uc-toolbar">
          <div class="uc-tabs" role="tablist" aria-label="Result type">
            <button role="tab" id="uc-tab-projects" data-tab="projects" aria-selected="true">Projects</button>
            <button role="tab" id="uc-tab-datasets" data-tab="datasets" aria-selected="false">Datasets</button>
          </div>
          <span class="uc-count" id="uc-count" aria-live="polite"></span>
          <span style="flex:1"></span>
          <label class="uc-sr" for="uc-sort">Sort by</label>
          <select id="uc-sort">
            <option value="match">Best match</option><option value="new">Newest first</option><option value="old">Oldest first</option>
            <option value="length">Longest record</option><option value="fine">Finest sampling</option><option value="title">Title A–Z</option>
          </select>
        </div>
        <div id="uc-results"></div>
      </main>
    </div>
    <div id="uc-error" class="uc-err" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('uop-catalog');
    const CATALOG_URL = root.dataset.catalogUrl || './catalog.json';
    const PALETTE = ['#0b6e8f', '#c2410c', '#6d28d9', '#15803d', '#b4235a', '#a16207', '#0e7490', '#475569'];
    const $ = s => root.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const uniq = a => [...new Set(a)];
    const isNum = v => v !== '' && v != null && !Number.isNaN(+v);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : s);

    /* =====================================================================
       Variable groups (only used to organise the variable list)
       ===================================================================== */
    const GROUP_RULES = [
      ['Wind', /wind|stress/], ['Precipitation', /rain|precip/], ['Humidity & pressure', /humidity|pressure/],
      ['Radiation & heat flux', /radiation|longwave|shortwave|flux/], ['Salinity & density', /salinity|density|sigma/],
      ['Currents', /sea[ _]water[ _](velocity|speed)|(eastward|northward)[ _]sea[ _]water|direction[ _]of[ _]sea[ _]water|\b[uv]cur\b/],
      ['Air temperature', /air[ _]temperature|\bairt\b/], ['Sea temperature', /temperature|\btemp\b|tskin/],
    ];
    const GROUP_ORDER = GROUP_RULES.map(r => r[0]).concat('Other');
    function paramGroup(v) {
      const s = `${v.standard_name || ''} ${v.long_name || ''} ${v.code || ''}`.toLowerCase();
      for (const [name, re] of GROUP_RULES) if (re.test(s)) return name;
      return 'Other';
    }

    /* =====================================================================
       Formatting helpers
       ===================================================================== */
    const monthFmt = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric', timeZone: 'UTC' });
    const fmtMonth = ms => monthFmt.format(new Date(ms));
    const NOW = Date.now();                       // an end date equal to NOW means “still ongoing”
    const periodText = (a, b) => a == null ? '—' : (b == null || b === NOW) ? `${fmtMonth(a)} – present` : (fmtMonth(a) === fmtMonth(b) ? fmtMonth(a) : `${fmtMonth(a)} – ${fmtMonth(b)}`);
    function durationText(a, b) {
      if (a == null || b == null) return '';
      const days = Math.round((b - a) / 86400000);
      if (days < 45) return `${days} day${days === 1 ? '' : 's'}`;
      const months = days / 30.44;
      return months < 24 ? `${Math.round(months)} months` : `${(months / 12).toFixed(1)} years`;
    }
    const fmtLat = v => `${Math.abs(v).toFixed(2)}° ${v >= 0 ? 'N' : 'S'}`;
    const fmtLon = v => `${Math.abs(v).toFixed(2)}° ${v >= 0 ? 'E' : 'W'}`;

    /* =====================================================================
       Range slider (time: horizontal, depth: vertical)
       ===================================================================== */
    function makeSlider(host, cfg) {

        <button type="button" class="uc-sl-handle" data-h="lo" role="slider" aria-label="${esc(cfg.label)} start"></button>
        <button type="button" class="uc-sl-handle" data-h="hi" role="slider" aria-label="${esc(cfg.label)} end"></button></div>`;

      const pos = f => `${(f * 100).toFixed(3)}%`;

    function renderTimeline(res) {

    // Variable groups (columns, same groups as the left-hand filter) against depth (rows), for the datasets in the results.

    const PER_PROJECT_MAX = 6, DEPTH_BINS = 40;

      const lines = t => { const out = []; let cur = ''; t.split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > 15 && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }); out.push(cur); return out; };

      };
      let maxC = 1;
      const cols = gs.map(g => {
        const items = list.filter(d => d.groups.includes(g)), bins = Array.from({ length: DEPTH_BINS }, () => []);
        if (agg) { items.forEach(d => binsOf(d).forEach(b => bins[b].push(d))); maxC = Math.max(maxC, ...bins.map(b => b.length)); }
        return { g, items, bins };
      });
      // legend
      if (agg) {
        body += `<defs><linearGradient id="uc-lg"><stop offset="0" stop-color="#d6e8f0"/><stop offset="1" stop-color="#0b4f68"/></linearGradient></defs>`
          + `<text x="${L}" y="18">Fewer datasets</text><rect x="${L + 84}" y="9" width="90" height="10" fill="url(#uc-lg)"/><text x="${L + 180}" y="18">More datasets (up to ${maxC}) · ${ents.length} ${byBasin ? 'basins' : 'projects'}.${byBasin ? '' : ` Narrow to ${PER_PROJECT_MAX} or fewer projects to see each one, or split by ocean basin.`}</text>`;
      } else {
        let lx = L; ents.forEach(e => { body += `<circle cx="${lx + 5}" cy="14" r="5" fill="${e.color}"/><text x="${lx + 14}" y="18">${esc(e.label)}</text>`; lx += 30 + e.label.length * 6.6; });
      }
      const shade = c => { const t = c / maxC, a = [214, 232, 240], b = [11, 79, 104]; return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * t)).join(',')})`; };
      cols.forEach((col, i) => {
        const cx0 = L + slot * i, g = col.g, items = col.items;
        if (i > 0) grid += `<line x1="${cx0.toFixed(1)}" x2="${cx0.toFixed(1)}" y1="${TOP - 4}" y2="${TOP + PH}" stroke="#e3e9ee"/>`;
        if (agg) {
          col.bins.forEach((ds, b) => {
            if (!ds.length) return;
            body += `<rect x="${(cx0 + slot * .2).toFixed(1)}" y="${(TOP + b / DEPTH_BINS * PH).toFixed(1)}" width="${(slot * .6).toFixed(1)}" height="${(PH / DEPTH_BINS + .6).toFixed(1)}" fill="${shade(ds.length)}"/>`;
          });
        } else {
          ents.forEach((p, pi) => {
            const px = cx0 + slot * (pi + .5) / np, mine = items.filter(d => inEnt(d, p));
            if (!mine.length) return;
            const lv = uniq(mine.flatMap(d => (d.dLevels.length ? d.dLevels : [d.dMin, d.dMax]).filter(v => v != null))).sort((a, b) => a - b);
            if (lv.length > 1) body += `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${y(lv[0]).toFixed(1)}" y2="${y(lv[lv.length - 1]).toFixed(1)}" stroke="${p.color}" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/>`;
            const hw = Math.min(9, slot / np / 2 - 2);
            lv.forEach(l => { body += `<line x1="${(px - hw).toFixed(1)}" x2="${(px + hw).toFixed(1)}" y1="${y(l).toFixed(1)}" y2="${y(l).toFixed(1)}" stroke="${p.color}" stroke-width="2"/>`; });
          });
        }
        const ls = lines(g);
        body += `<text class="uc-ch-h" text-anchor="middle" x="${(cx0 + slot / 2).toFixed(1)}" y="${TOP + PH + 18}">${ls.map((t, n) => `<tspan x="${(cx0 + slot / 2).toFixed(1)}" dy="${n ? 14 : 0}">${esc(t)}</tspan>`).join('')}</text>`;
      });
      if (!gs.length) body += `<text x="${(L + pw / 2).toFixed(1)}" y="${TOP + 40}" text-anchor="middle">${list.length ? 'None of the datasets in the results have water-column variables.' : 'No datasets match the current filters.'}</text>`;
      const lo = isNum(state.dmin) ? +state.dmin : 0, hi = isNum(state.dmax) ? +state.dmax : depthMax;
      const selR = depthActive(state) ? `<rect id="uc-sel" x="${L}" y="${y(lo).toFixed(1)}" width="${pw}" height="${Math.max(2, y(hi) - y(lo)).toFixed(1)}" fill="#0b6e8f" fill-opacity=".14" stroke="#0b6e8f"/>` : '';
      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Depths at which each group of variables is measured, for the datasets in the results">${grid}${body}${selR}<rect id="uc-brush" x="${L}" y="${TOP}" width="${pw}" height="${PH}" fill="transparent" style="cursor:crosshair"/></svg>`;
      attachBrush(host.querySelector('svg'), {
        axis: 'y', a: TOP, b: TOP + PH, x0: L, x1: W - R,
        at: p => {
          const i = Math.floor((p.x - L) / slot); if (i < 0 || i >= cols.length) return null;
          if (!agg) return cols[i];
          const b = clamp(Math.floor((p.y - TOP) / PH * DEPTH_BINS), 0, DEPTH_BINS - 1), ds = cols[i].bins[b];
          return ds.length ? { g: cols[i].g, items: ds, bin: b } : null;
        },
        hoverFn: c => {
          const vs = uniq(c.items.flatMap(d => d.vkeys.filter(k => varInfo.get(k).group === c.g))).map(k => varInfo.get(k).label);
          const pn = uniq(c.items.map(d => d.project.short)), pshow = pn.length > 5 ? pn.slice(0, 5).join(', ') + ` +${pn.length - 5} more` : pn.join(', ');
          if (c.bin != null) {
            const a = depthVal(c.bin / DEPTH_BINS), b = depthVal((c.bin + 1) / DEPTH_BINS);
            return `<strong>${esc(c.g)}</strong> at ${n1(a)}–${n1(b)} m · ${c.items.length} dataset${c.items.length === 1 ? '' : 's'} in ${pn.length} project${pn.length === 1 ? '' : 's'}: ${esc(pshow)}`;
          }
          const mins = c.items.map(d => d.dMin).filter(n => n != null), maxs = c.items.map(d => d.dMax).filter(n => n != null);
          return `<strong>${esc(c.g)}</strong> · ${esc(vs.join(', '))} · ${c.items.length} dataset${c.items.length === 1 ? '' : 's'} · ${esc(pshow)} · depth ${mins.length ? esc(depthText({ min: Math.min(...mins), max: Math.max(...maxs) })) : '—'}`;
        },
        clear: () => { if (depthActive(state)) { state.dmin = state.dmax = ''; update(); } },
        commit: (a, b) => {
          const lo2 = Math.round(inv(a) * 2) / 2, hi2 = Math.round(inv(b) * 2) / 2;
          state.dmin = lo2 <= 0 ? '' : String(lo2); state.dmax = hi2 >= depthMax ? '' : String(hi2); update();
        }
      });
    }

    function renderMap(list) {
      if (typeof L === 'undefined') { $('#uc-map').innerHTML = '<div class="uc-mapnote">The map could not be loaded.</div>'; return; }
      if (!map) {
        map = L.map('uc-map', { worldCopyJump: true, scrollWheelZoom: false }).setView([30, -40], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
        layer = L.layerGroup().addTo(map); areaLayer = L.layerGroup().addTo(map);
        map.on('mousedown', e => {
          if (!boxMode) return;
          boxStart = e.latlng; boxRect = L.rectangle([e.latlng, e.latlng], { color: '#0b6e8f', weight: 2, dashArray: '6 4', fillOpacity: .12, interactive: false }).addTo(map);
        });
        map.on('mousemove', e => { if (boxMode && boxStart && boxRect) boxRect.setBounds(L.latLngBounds(boxStart, e.latlng)); });
        map.on('mouseup', e => {
          if (!boxMode || !boxStart) return;
          const a = boxStart, b = e.latlng; boxStart = null; if (boxRect) { boxRect.remove(); boxRect = null; }
          endBoxMode();
          if (Math.abs(a.lat - b.lat) < 0.05 && Math.abs(a.lng - b.lng) < 0.05) return;
          const r = x => Math.round(x * 100) / 100, wrap = x => ((((x + 180) % 360) + 360) % 360) - 180;
          const lo = Math.min(a.lng, b.lng), hi = Math.max(a.lng, b.lng);
          state.s = String(r(clamp(Math.min(a.lat, b.lat), -90, 90))); state.n = String(r(clamp(Math.max(a.lat, b.lat), -90, 90)));
          if (hi - lo >= 360) state.w = state.e = ''; else { state.w = String(r(wrap(lo))); state.e = String(r(wrap(hi))); }
          update();
        });
        map.on('popupopen', e => {
          const b = e.popup.getElement().querySelector('button[data-project]');
          if (b) b.addEventListener('click', () => { state.projects = new Set([b.dataset.project]); map.closePopup(); update(); });
        });
      }
      map.invalidateSize(); layer.clearLayers(); areaLayer.clearLayers();
      const spots = new Map();
      list.forEach(d => {
        const l = d.location; if (!l || l.latitude == null) return;
        const k = `${d.project.id}|${l.latitude.toFixed(3)}|${l.longitude.toFixed(3)}`;
        if (!spots.has(k)) spots.set(k, { lat: l.latitude, lon: l.longitude, project: d.project, items: [] });
        spots.get(k).items.push(d);
      });
      const pts = [];
      spots.forEach(s => {
        const m = L.circleMarker([s.lat, s.lon], { radius: 7 + Math.min(s.items.length, 5), color: '#fff', weight: 2, fillColor: s.project.color, fillOpacity: .92 });
        m.bindPopup(`<strong>${esc(s.project.short)}</strong><br>${esc(fmtLat(s.lat))}, ${esc(fmtLon(s.lon))}<br>${s.items.length} dataset${s.items.length === 1 ? '' : 's'}<br><button data-project="${esc(s.project.id)}">Show this project</button>`);
        m.bindTooltip(`${s.project.short} · ${s.items.length}`); m.addTo(layer); pts.push([s.lat, s.lon]);
      });
      if (areaActive(state)) {
        const s = isNum(state.s) ? +state.s : -90, n = isNum(state.n) ? +state.n : 90, w = isNum(state.w) ? +state.w : -180, e = isNum(state.e) ? +state.e : 180;
        if (w <= e) L.rectangle([[s, w], [n, e]], { color: '#0b6e8f', weight: 2, dashArray: '6 4', fillOpacity: .06, interactive: false }).addTo(areaLayer);
      }
      if (pts.length === 1) map.setView(pts[0], 5); else if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 6 });
    }

    function renderViz(res) {
      const v = state.view;
      if (v !== 'map' && boxMode) endBoxMode();
      root.querySelectorAll('.uc-seg button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
      $('#uc-map').hidden = v !== 'map'; $('#uc-chart').hidden = v !== 'time' && v !== 'vardepth';
      $('#uc-hover').hidden = v !== 'time' && v !== 'vardepth'; $('#uc-hover').innerHTML = ''; $('#uc-draw').hidden = v !== 'map'; $('#uc-clearbox').hidden = v !== 'map' || !areaActive(state);
      $('#uc-cleartime').hidden = v !== 'time' || !timeActive(state);
      $('#uc-cleardepth').hidden = v !== 'vardepth' || !depthActive(state);
      $('#uc-cleardepth').textContent = `✕ Clear depth range (${state.dmin || 0}–${state.dmax || depthMax} m)`;
      $('#uc-cleartime').textContent = `✕ Clear period (${ymLabel(state.from) || 'start'} – ${ymLabel(state.to) || 'end'})`;
      $('#uc-vizhelp').textContent = '';
      $('#uc-by').hidden = $('#uc-bylabel').hidden = v !== 'vardepth';
      root.querySelectorAll('#uc-by button').forEach(b => { const on = b.dataset.by === state.by; b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-selected', String(on)); });
      if (v === 'map') renderMap(res.list);
      else if (v === 'time') renderTimeline(res);
      else if (v === 'vardepth') renderVarDepth(res);
    }

    /* =====================================================================
       Update cycle
       ===================================================================== */
    function update() {
      const res = lastRes = compute(state, true);
      writeUrl(); renderFacets(res);
      const chips = chipList(), kinds = activeKinds(state);
      $('#uc-reset-top').setAttribute('aria-disabled', String(!kinds.filter(k => k !== 'q').length));
      $('#uc-active').innerHTML = chips.map(([id, lab]) => `<button class="uc-fchip" data-remove="${esc(id)}" aria-label="Remove ${esc(lab)}">${esc(lab)} <b aria-hidden="true">×</b></button>`).join('')
        + (kinds.length ? '<button class="uc-link" data-clearall>Clear all</button>' : '');
      $('#uc-sort').value = state.sort;
      $('#uc-from').value = state.from; $('#uc-to').value = state.to; $('#uc-dmin').value = state.dmin; $('#uc-dmax').value = state.dmax;
      tSlider.set(state.from ? ymToIdx(state.from) : 0, state.to ? ymToIdx(state.to) : tAxis.n - 1);
      dSlider.set(isNum(state.dmin) ? +state.dmin : 0, isNum(state.dmax) ? +state.dmax : depthMax);
      $('#uc-from').value = state.from; $('#uc-to').value = state.to; $('#uc-dmin').value = state.dmin; $('#uc-dmax').value = state.dmax;
      // projects (in the order their datasets appear) then datasets
      const order = [], seen = new Set();
      res.list.forEach(d => { if (!seen.has(d.project.id)) { seen.add(d.project.id); order.push(d.project); } });
      const projMatch = order.map(p => ({ p, m: res.list.filter(d => d.project.id === p.id) }));
      root.querySelectorAll('.uc-tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === state.tab)));
      $('#uc-tab-projects').textContent = `Projects (${projMatch.length})`;
      $('#uc-tab-datasets').textContent = `Datasets (${res.list.length})`;
      $('#uc-count').textContent = `${res.list.length} of ${datasets.length} datasets in ${projMatch.length} of ${projects.length} projects`;
      const out = $('#uc-results');
      if (!res.list.length) out.innerHTML = emptyState();
      else out.innerHTML = state.tab === 'projects' ? projMatch.map(x => cardProject(x.p, x.m)).join('') : res.list.map(cardDataset).join('');
      renderViz(res);
    }

    /* =====================================================================
       Events
       ===================================================================== */
    const toggle = (set, v) => (set.has(v) ? set.delete(v) : set.add(v));
    function keepFocus(fn) { const id = document.activeElement && document.activeElement.id; fn(); if (id) { const el = document.getElementById(id); if (el) el.focus({ preventScroll: true }); } }
    function clearAll() { Object.assign(state, { ...fresh(), sort: state.sort, tab: state.tab, view: state.view }); $('#uc-q').value = ''; }
    function startBoxMode() {
      if (!map || state.view !== 'map') return;
      boxMode = true; map.dragging.disable(); map.getContainer().style.cursor = 'crosshair';
      $('#uc-draw').textContent = 'Drag on the map…'; $('#uc-draw').classList.add('uc-on');
    }
    function endBoxMode() {
      boxMode = false; boxStart = null; if (map) { map.dragging.enable(); map.getContainer().style.cursor = ''; }
      $('#uc-draw').textContent = '▭ Draw filter box'; $('#uc-draw').classList.remove('uc-on');
    }
    function bind() {
      let t, rz;
      $('#uc-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 120); });
      $('#uc-vfilter').addEventListener('input', e => { varFilter = e.target.value; update(); });
      $('#uc-sort').addEventListener('change', e => { state.sort = e.target.value; update(); });
      $('#uc-mode').addEventListener('change', e => { state.mode = e.target.value; update(); });
      ['dmin', 'dmax'].forEach(k => $('#uc-' + k).addEventListener('change', e => { state[k] = e.target.value; update(); }));
      ['from', 'to'].forEach(k => $('#uc-' + k).addEventListener('change', e => {
        const v = e.target.value; state[k] = parseYm(v) ? v : '';
        if (state.from && state.to && state.from > state.to) state[k === 'from' ? 'to' : 'from'] = state[k];
        update();
      }));
      $('#uc-draw').addEventListener('click', () => { boxMode ? endBoxMode() : startBoxMode(); });
      $('#uc-clearbox').addEventListener('click', () => { clearKind(state, 'area'); update(); });
      $('#uc-cleartime').addEventListener('click', () => { clearKind(state, 'time'); update(); });
      $('#uc-cleardepth').addEventListener('click', () => { clearKind(state, 'depth'); update(); });
      $('#uc-reset-top').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (e.currentTarget.getAttribute('aria-disabled') === 'true') return; const q = state.q; clearAll(); state.q = q; $('#uc-q').value = q; update(); });
      root.addEventListener('change', e => {
        const f = e.target.dataset && e.target.dataset.facet; if (!f) return;
        keepFocus(() => { toggle(f === 'project' ? state.projects : state.vars, e.target.value); update(); });
      });
      root.addEventListener('toggle', e => { const g = e.target.dataset && e.target.dataset.g; if (g) (e.target.open ? openGroups.add(g) : openGroups.delete(g)); }, true);
      root.addEventListener('click', e => {
        const el = e.target.closest('[data-tab],[data-view],[data-project],[data-var],[data-remove],[data-clearall],[data-viewproject],[data-clamp],[data-relax],[data-replace],[data-by]');
        if (!el) return;
        const d = el.dataset;
        if (d.tab) { state.tab = d.tab; update(); }
        else if (d.view) { state.view = d.view; update(); }
        else if (d.by) { state.by = d.by; update(); }
        else if (d.viewproject) { state.projects = new Set([d.viewproject]); state.tab = 'datasets'; update(); $('.uc-toolbar').scrollIntoView({ block: 'start' }); }
        else if (d.project) { state.projects = new Set([d.project]); update(); }
        else if (d.var) { toggle(state.vars, d.var); update(); }
        else if (d.clearall !== undefined) { clearAll(); update(); }
        else if (d.relax) { clearKind(state, d.relax); if (d.relax === 'q') $('#uc-q').value = ''; update(); }
        else if (d.replace) { const [from, to] = d.replace.split('|'); state.q = state.q.replace(new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), to); $('#uc-q').value = state.q; update(); }
        else if (d.clamp) { const p = document.getElementById(d.clamp); p.classList.toggle('uc-open'); el.textContent = p.classList.contains('uc-open') ? 'Show less' : 'Read more'; }
        else if (d.remove) {
          const [kind, val] = d.remove.split(/:(.*)/s);
          if (kind === 'project') state.projects.delete(val); else if (kind === 'var') state.vars.delete(val); else clearKind(state, kind);
          update();
        }
      });
      window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (lastRes && (state.view === 'time' || state.view === 'vardepth')) renderViz(lastRes); }, 150); });
      const mq = matchMedia('(max-width: 900px)'), sync = () => { $('#uc-filters').open = !mq.matches; };
      mq.addEventListener('change', sync); sync();
    }

    async function init() {
      try {
        const res = await fetch(`${CATALOG_URL}${CATALOG_URL.includes('?') ? '&' : '?'}v=${Date.now()}`);
        if (!res.ok) throw new Error(`Could not load the catalog file (${res.status}).`);
        prepare(await res.json());
      } catch (err) {
        console.error(err);
        const box = $('#uc-error'); box.hidden = false;
        box.textContent = `The catalog could not be loaded. ${err.message} If you opened this file directly from disk, serve the folder with a local web server instead.`;
        return;
      }
      readUrl();
      $('#uc-q').value = state.q;
      $('#uc-from').min = idxToYm(0); $('#uc-from').max = idxToYm(tAxis.n - 1); $('#uc-to').min = idxToYm(0); $('#uc-to').max = idxToYm(tAxis.n - 1);
      $('#uc-app').hidden = false;
      buildSliders(); bind(); update();
    }
    init();
  })();
  </script>
</body>
</html>
